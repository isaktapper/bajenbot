name: bajenbot

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHubs kortaste intervall
  workflow_dispatch:         # kör manuellt från Actions-fliken

permissions:
  contents: write            # för att spara seen.json

concurrency:
  group: bajenbot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Kolla nyheter
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bajenbot.py
      - name: Spara vad som setts
        run: |
          if ! git diff --quiet seen.json; then
            git config user.name "bajenbot"
            git config user.email "bajenbot@users.noreply.github.com"
            git add seen.json
            git commit -m "seen: uppdaterad"
            git push
          fi
